name: omnibus

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: omnibus-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnibus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnibus}
      POSTGRES_DB: ${POSTGRES_DB:-omnibus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - omnibus-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  omnibus-pgdata:
